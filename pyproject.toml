[project]
name = "parallel-demo2"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # 0.10.30+ removed the legacy `mp.solutions` API used in
    # vision/mediapipe/mp_vision.py. 0.10.18-0.10.21 cap numpy at <2 which
    # conflicts with our dev group, so we stay on 0.10.14 here. To unpin in
    # the future, migrate the vision module to the new `mp.tasks` API and
    # bump to mediapipe>=0.10.30.
    "mediapipe==0.10.14",
    "opencv-python>=4.12.0",
    "opencv-python-headless>=4.12.0",
    "pydantic>=2.9.2",
    "pygame>=2.6.1",
    "pyserial>=3.5",
    "keyboard>=0.13.5",
    "ultralytics>=8.3.223",
    "yappi>=1.7.3",
    "snakeviz>=2.2.2",
    "typer>=0.20.0",
]

[dependency-groups]
dev = [
    "ipdb>=0.13.13",
    "ipykernel>=7.1.0",
    "ipython>=8.29.0",
    "matplotlib>=3.9.2",
    "numpy>=2.1.3",
    "openpyxl>=3.1.0",
    "pandas>=2.3.3",
    "pillow>=11.0.0",
    "pytest>=9.0.3",
    "reportlab>=4.4.0",
    "ruff>=0.7.4",
    "typer>=0.20.0",
]
